<style>
/* Layout: a quest board. Sticky XP bar on top, mission rail left, one mission at a time on the right. */
:root{
  --paper:#f5f6f2; --card:#ffffff; --ink:#18213a; --muted:#5b6478; --line:#dcdfe6;
  --brand:#2b3a8c; --brand-soft:#e6e9f7; --gold:#d99a16; --gold-soft:#fbf0d6;
  --good:#1f7a4d; --good-soft:#e1f2e8; --warn:#b26a00; --bad:#b3261e; --bad-soft:#fbe4e2;
  --s-brief:#2b3a8c; --s-check:#0f7c80; --s-bron:#8a4fb8; --s-kies:#c25a1c;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121626; --card:#1a2033; --ink:#e9ecf5; --muted:#a3abc0; --line:#2e3650;
  --brand:#9aa8ff; --brand-soft:#252d4f; --gold:#f0b43a; --gold-soft:#3a3018;
  --good:#5cc98f; --good-soft:#173528; --warn:#f0a84a; --bad:#ff8a80; --bad-soft:#3d1f1e;
  --s-brief:#9aa8ff; --s-check:#4fc6c9; --s-bron:#c99bf0; --s-kies:#f39a62; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121626; --card:#1a2033; --ink:#e9ecf5; --muted:#a3abc0; --line:#2e3650;
  --brand:#9aa8ff; --brand-soft:#252d4f; --gold:#f0b43a; --gold-soft:#3a3018;
  --good:#5cc98f; --good-soft:#173528; --warn:#f0a84a; --bad:#ff8a80; --bad-soft:#3d1f1e;
  --s-brief:#9aa8ff; --s-check:#4fc6c9; --s-bron:#c99bf0; --s-kies:#f39a62; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:12px}
.logo{display:flex;flex-direction:column;min-width:0}
.logo b{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.logo span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.xp{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;flex:1;min-width:0}
.meter{display:grid;grid-template-columns:auto 72px auto;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.meter .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:4px}
.meter b{font-family:var(--f-mono);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.total{font-family:var(--f-mono);font-weight:600;background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold);padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.roles{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.roles button{border:0;background:none;padding:6px 14px;cursor:pointer;font-size:13px}
.roles button[aria-pressed="true"]{background:var(--brand);color:var(--card)}

/* layout */
.main{display:grid;grid-template-columns:260px 1fr;gap:24px;padding-block:24px 64px}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.rail{display:flex;flex-direction:column;gap:6px;min-width:0}
@media (max-width:820px){.rail{flex-direction:row;overflow-x:auto;padding-bottom:4px;align-items:flex-start}.rail .note{min-width:300px}}
.step{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px 10px;cursor:pointer;min-width:0}
@media (max-width:820px){.step{min-width:190px}}
.step:hover{background:var(--card);border-color:var(--line)}
.step[aria-current="true"]{background:var(--card);border-color:var(--brand)}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;border:1.5px solid var(--line);background:var(--card)}
.step.done .n{background:var(--good);border-color:var(--good);color:var(--card)}
.step.locked{opacity:.55;cursor:not-allowed}
.step small{display:block;color:var(--muted);font-size:12px}
.step strong{font-weight:600;font-size:14px}
.rail .note{font-size:12px;color:var(--muted);padding:8px 10px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;min-width:0}
@media (max-width:560px){.panel{padding:18px}}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel h2{font-size:28px;margin:4px 0 8px}
.lead{color:var(--muted);max-width:68ch;margin:0 0 20px}
.skilltags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;border:1.5px solid currentColor}
.t-brief{color:var(--s-brief)}.t-check{color:var(--s-check)}.t-bron{color:var(--s-bron)}.t-kies{color:var(--s-kies)}.t-bonus{color:var(--gold)}

.block{border-top:1px solid var(--line);padding-top:20px;margin-top:20px;display:flex;flex-direction:column;gap:14px}
.block h3{font-size:18px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-weight:600;font-size:14px}
.field .hint{font-size:13px;color:var(--muted)}
input[type=text],select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:90px;resize:vertical}
textarea.tall{min-height:160px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{border:1px solid var(--brand);background:var(--brand);color:var(--card);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.ghost{background:none;color:var(--brand)}
.btn.small{padding:5px 10px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.prompt{background:var(--brand-soft);border:1px dashed var(--brand);border-radius:10px;padding:14px;font-family:var(--f-mono);font-size:13px;white-space:pre-wrap;word-break:break-word}
.status{font-size:13px;color:var(--muted)}
.ok{color:var(--good);font-weight:600}
.callout{background:var(--gold-soft);border-left:4px solid var(--gold);padding:12px 14px;border-radius:0 8px 8px 0;font-size:14px}

/* strategiemodel */
.vak{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.vak header{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.vak header h3{font-size:17px}
.checks{display:grid;gap:6px}
.check{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 10px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"].y{background:var(--good-soft);color:var(--good);font-weight:600}
.seg button[aria-pressed="true"].d{background:var(--gold-soft);color:var(--warn);font-weight:600}
.seg button[aria-pressed="true"].n{background:var(--bad-soft);color:var(--bad);font-weight:600}
.gerretsen{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.gerretsen label{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}

/* bronnen */
table{border-collapse:collapse;width:100%;font-size:14px}
.tablewrap{overflow-x:auto}
.cscale{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0 12px}.cscale div{border-radius:12px;padding:10px 12px;border:1px solid var(--line,rgba(255,255,255,.12));display:flex;flex-direction:column;gap:2px}.cscale b{font-size:26px;line-height:1.1}.cscale span{font-family:var(--f-mono,monospace);font-weight:700;color:#1A0B2E;font-size:13px}.cscale small{color:#3A2C55;font-size:12px;font-weight:700}@media (max-width:620px){.cscale{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.ctab thead{display:none}.ctab,.ctab tbody,.ctab td{display:block;width:100%}.ctab tr{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line,rgba(255,255,255,.12))}.ctab td{padding:0;border:0;width:auto}.ctab td:nth-child(4),.ctab td:nth-child(5){grid-column:1/-1}}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.p-bev{background:var(--good-soft);color:var(--good)}.p-wee{background:var(--bad-soft);color:var(--bad)}.p-onb{background:var(--gold-soft);color:var(--warn)}
.p-prim{background:var(--brand-soft);color:var(--brand)}

/* keuze */
.routes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:860px){.routes{grid-template-columns:1fr}}
.route{border:1.5px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.route.chosen{border-color:var(--s-kies);box-shadow:0 0 0 3px color-mix(in srgb,var(--s-kies) 20%,transparent)}

/* bug hunt */
.doc{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--paper);line-height:1.8}
.doc h4{font-family:var(--f-display);margin:12px 0 2px;font-size:15px}
.sent{cursor:pointer;border-radius:4px;padding:1px 2px}
.sent:hover{background:var(--brand-soft)}
.sent.flag{background:var(--bad-soft);text-decoration:underline wavy var(--bad)}
.sent.hit{background:var(--good-soft);text-decoration:none}
.sent.miss{background:var(--bad-soft);text-decoration:line-through}
.flaglist{display:flex;flex-direction:column;gap:8px}
.flagitem{display:grid;grid-template-columns:1fr minmax(160px,220px) auto;gap:8px;align-items:center;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px}
@media (max-width:640px){.flagitem{grid-template-columns:1fr}}

/* oplevering */
.profile{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:700px){.profile{grid-template-columns:1fr 1fr}}
.skill{border:1px solid var(--line);border-radius:12px;padding:14px}
.skill .v{font-family:var(--f-mono);font-size:26px;font-weight:600}
.skill .bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.skill .bar i{display:block;height:100%}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;min-width:220px;flex:1}
.badge .medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;border:2px solid var(--line);color:var(--muted)}
.badge.on{border-color:var(--gold);background:var(--gold-soft)}
.badge.on .medal{border-color:var(--gold);background:var(--gold);color:var(--card)}
.badge small{display:block;color:var(--muted);font-size:12px}
.boards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.boards{grid-template-columns:1fr}}
tr.me td{background:var(--gold-soft);font-weight:600}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.example{font-size:12px;color:var(--muted);font-style:italic}
@media (max-width:600px){.meter{display:none}.top .wrap{gap:8px 12px}.xp{min-width:max-content}.levels button{padding:6px 10px}}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
@media (prefers-reduced-motion:no-preference){.xpflash{animation:fl .8s ease}@keyframes fl{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}}

/* Ontwerp 2: Neon studio. Een donkere creator-studio met gloeiende accenten, alsof je achter de knoppen van een opnamestudio zit. Bewust altijd donker. */
:root,:root:not([data-theme="light"]),:root[data-theme="dark"],:root[data-theme="light"]{
 --f-display:"Unbounded","Trebuchet MS",sans-serif;--f-body:"Manrope","Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,monospace;
 --paper:#120B26;--card:#1C1338;--ink:#F5F0FF;--muted:#B4A8D9;--line:#3A2C66;
 --brand:#FF5FDC;--brand-soft:#33184A;--gold:#FFB547;--gold-soft:#3A2812;
 --good:#3CF0A0;--good-soft:#12352A;--warn:#FFB547;--bad:#FF6B81;--bad-soft:#3E1724;
 --s-brief:#8C9BFF;--s-check:#3CE6E0;--s-bron:#FF6BE5;--s-kies:#FFA14A;color-scheme:dark}
body{background:radial-gradient(ellipse at 10% -10%,#3B1670 0,transparent 45%),radial-gradient(ellipse at 95% 10%,#0E3A5C 0,transparent 40%),var(--paper);background-attachment:fixed}
.top{background:rgba(18,11,38,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo b{font-weight:800;font-size:19px;background:linear-gradient(90deg,#FF5FDC,#FFA14A);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#FF3B5C;margin-right:7px;box-shadow:0 0 10px #FF3B5C;vertical-align:1px}
@media (prefers-reduced-motion:no-preference){.logo span::before{animation:rec 1.6s ease-in-out infinite}@keyframes rec{50%{opacity:.25}}}
.panel{border:1px solid var(--line);box-shadow:0 0 0 1px rgba(255,95,220,.06),0 24px 60px rgba(0,0,0,.4);border-radius:20px;background:linear-gradient(180deg,#21164200,#1C1338),var(--card)}
.panel h2{font-weight:700;font-size:26px;letter-spacing:-.01em}
.eyebrow{color:var(--gold)}
.btn{background:linear-gradient(90deg,#FF5FDC,#FF8A4C);border:0;color:#1A0B2E;border-radius:999px;font-weight:800;box-shadow:0 0 22px rgba(255,95,220,.35)}
.btn.ghost{background:none;border:1.5px solid #FF5FDC;color:#FF9BEB;box-shadow:none}
.total{background:linear-gradient(90deg,#FF5FDC,#FFA14A);color:#1A0B2E;border:0;box-shadow:0 0 18px rgba(255,161,74,.35)}
.roles button[aria-pressed="true"]{background:#FF5FDC;color:#1A0B2E}
.meter .bar i{filter:drop-shadow(0 0 4px rgba(255,255,255,.35))}
.step[aria-current="true"]{border-color:#FF5FDC;box-shadow:0 0 20px rgba(255,95,220,.3);background:var(--card)}
.step .n{background:var(--paper)}
.step.done .n{color:#0B1F17}
.tag{background:rgba(255,255,255,.04)}
input[type=text],select,textarea{background:#140D2B;border-color:#3A2C66}
input:focus,select:focus,textarea:focus{border-color:#FF5FDC;box-shadow:0 0 0 3px rgba(255,95,220,.18)}
.vak,.route,.skill,.flagitem,.doc,.badge{border-color:#3A2C66;border-radius:16px;background:rgba(255,255,255,.02)}
.route.chosen{box-shadow:0 0 24px rgba(255,161,74,.35)}
.badge.on{background:linear-gradient(135deg,#3A2812,#33184A);border-color:var(--gold)}
.badge.on .medal{color:#1A0B2E}
.callout{background:rgba(255,181,71,.1)}
.prompt{background:#1A1036;border-color:#8C9BFF}
.skill .v{background:linear-gradient(90deg,#FFFFFF,#FFB547);-webkit-background-clip:text;background-clip:text;color:transparent}
.toast{background:#FF5FDC;color:#1A0B2E}


/* Feestje: kort dansend neonfiguurtje na een missie, groot feest na een level. */
.party{position:fixed;z-index:60;pointer-events:none;display:flex;align-items:center;gap:10px}
.party.mis{right:16px;bottom:16px;background:rgba(26,16,44,.94);border:2px solid #FF5FDC;border-radius:18px;padding:8px 16px 8px 8px;box-shadow:0 0 18px rgba(255,95,220,.55);color:#FFF4E8;max-width:calc(100vw - 32px)}
.party.mis svg{width:64px;height:76px;flex:none}
@media (max-width:600px){.party.mis{top:12px;bottom:auto;left:12px;right:12px}}
.party .pt{font-weight:800;font-size:16px;text-shadow:0 0 8px rgba(255,161,74,.8)}
.party .ps{font-size:13px;color:#FFD9F4}
.party.lvl{inset:0;pointer-events:auto;flex-direction:column;justify-content:center;background:rgba(10,6,22,.86);text-align:center;padding:16px;color:#FFF4E8}
.party.lvl svg{width:150px;height:178px}
.party.lvl .pt{font-size:clamp(26px,6vw,42px);color:#FFF4E8;text-shadow:0 0 10px #FF5FDC,0 0 28px #FF5FDC,0 0 50px rgba(255,161,74,.7)}
.party.lvl .ps{font-size:16px;max-width:460px}
.party.lvl .btn{margin-top:14px}
.party .cf{position:absolute;top:-20px;width:9px;height:16px;border-radius:2px;opacity:.95}
.party .neo{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.party svg{overflow:visible;filter:drop-shadow(0 0 4px #FF5FDC) drop-shadow(0 0 10px rgba(255,161,74,.6))}
@media (prefers-reduced-motion:no-preference){
 .party.mis{animation:pin .35s cubic-bezier(.2,1.6,.4,1) both}
 .party.out{animation:pout .3s ease forwards}
 .party .bod{transform-box:fill-box;transform-origin:50% 100%}
 .party .d1 .bod{animation:dbounce .45s ease-in-out infinite alternate}
 .party .d2 .bod{animation:dsway .5s ease-in-out infinite alternate}
 .party .d3 .bod{transform-origin:50% 50%;animation:dspin 1.4s ease-in-out infinite}
 .party .arm{transform-box:fill-box}
 .party .arm.l{transform-origin:100% 100%;animation:wavl .3s ease-in-out infinite alternate}
 .party .arm.r{transform-origin:0 100%;animation:wavr .3s ease-in-out infinite alternate}
 .party .leg.l{transform-box:fill-box;transform-origin:100% 0;animation:kick .45s ease-in-out infinite alternate}
 .party .leg.r{transform-box:fill-box;transform-origin:0 0;animation:kick .45s ease-in-out infinite alternate-reverse}
 .party .cf{animation:fall linear forwards}
 .party.lvl .pt{animation:flick 1.2s steps(1) 1}
}
@keyframes pin{from{transform:translateY(40px) scale(.6);opacity:0}}
@keyframes pout{to{transform:translateY(30px);opacity:0}}
@keyframes dbounce{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(6deg)}}
@keyframes dsway{from{transform:rotate(-14deg)}to{transform:rotate(14deg) translateY(-6px)}}
@keyframes dspin{0%{transform:rotate(0)}30%{transform:translateY(-12px) rotate(-12deg)}60%{transform:translateY(0) rotate(12deg)}80%,100%{transform:scaleX(-1)}}
@keyframes wavl{from{transform:rotate(-25deg)}to{transform:rotate(20deg)}}
@keyframes wavr{from{transform:rotate(25deg)}to{transform:rotate(-20deg)}}
@keyframes kick{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes flick{0%,20%,40%{opacity:.3}10%,30%,50%,100%{opacity:1}}

const NUMTOK=/(\d{1,3}(?:[. ]\d{3}(?!\d))+(?:,\d+)?|\d+(?:[.,]\d+)?)(\s?(?:k|K|duizend|mln|miljoen)(?![\p{L}]))?/gu;

 s=s.replace(/[−–—]/g,"-");const pct=/%|procent/i.test(s);
 if(!opt.first){const rg=s.match(/(\d[\d.,]*\s?(?:k|K)?)\s*%?\s*(?:-|\/|t\/m|\s(?:à|á|a|tot(?:\s+en\s+met)?|of)\s)\s*€?\s*(\d[\d.,]*\s?(?:k|K)?)/);

   return{ok:false,range:true,v:0,pct,msg:"Bedoel je "+fmtNum(av)+" of "+fmtNum(bv)+"? Vul één getal in."};}}
 const toks=[...s.matchAll(NUMTOK)];
 if(!toks.length)return{ok:false,v:0,pct,msg:"Vul een getal in, bijvoorbeeld 1.500 of 4,5."};
 if(toks.length>1&&!opt.first)return{ok:false,v:0,pct,msg:"Je typte meer dan één getal. Vul één getal in."};
 const n=tokNum(toks[0]);if(!isFinite(n))return{ok:false,v:0,pct,msg:"Vul een getal in, bijvoorbeeld 1.500 of 4,5."};

 let bron=Math.min(20,full.length*5);if(full.some(r=>r.soort.startsWith("Primair")))bron+=5;
 /* Kiezen (max 25) = kernwaarden-missie (max 10) + keuzemoment (max 15) */

 K.routes.forEach(r=>{if(routeOk(r))kies+=1;});

 kies+=Math.min(6,Math.floor(sentences(K.waarom)/3*6));

}

.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:${prim};margin:16px 0 4px}
img.mood{width:100%;border-radius:12px;display:block}
.logos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.lv{margin:0;border-radius:12px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;border:1px solid rgba(0,0,0,.08)}
.lv img{max-width:80%;max-height:90px;object-fit:contain}.lv span{font-size:24px;font-weight:700}
.lv figcaption{font-size:12px;margin-top:10px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.85);color:#222}
.sws{display:grid;gap:12px}.sw{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
.chip{height:96px;border-radius:12px;display:flex;align-items:flex-end;padding:10px;font-weight:700;font-family:monospace;font-size:14px;border:1px solid rgba(0,0,0,.1)}
.swt b{display:block;font-size:17px}.swt small{display:block;color:#6A6478}.swt p{margin:6px 0 0}

.aa{display:inline-block;font-family:${kf};font-weight:700;font-size:20px;padding:6px 12px;border-radius:8px;border:1px solid rgba(0,0,0,.08)}
.spec1{font-family:${kf};font-size:56px;line-height:1.05;margin:4px 0 6px}.spec2{font-family:${tf};font-size:18px}
.abc{font-size:22px;letter-spacing:.04em;color:#6A6478;word-break:break-all}
.sch{display:grid;grid-template-columns:130px max-content 1fr;gap:12px;align-items:center;margin:8px 0}.schr{text-align:left}
.dots{display:flex;gap:8px}.dots i{width:18px;height:18px;border-radius:50%;border:2px solid ${prim};display:block}.dots i.on{background:${prim}}
.quote{border-left:5px solid ${acc};padding:10px 16px;background:rgba(0,0,0,.03);border-radius:0 10px 10px 0;margin-top:12px}
.dd{border-radius:12px;padding:18px}.do{border:2px solid #2E8B57}.dont{border:2px solid #C0392B}.dd h3{font-size:18px}.do h3{color:#2E8B57}.dont h3{color:#C0392B}

.pn{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:${prim}}.pk{font-size:28px;font-weight:700}
.cta{align-self:flex-start;background:${acc};color:${dk};font-weight:700;border-radius:999px;padding:8px 16px}
.tools{display:flex;justify-content:flex-end;margin-bottom:12px}.tools button{font:inherit;font-weight:700;background:${prim};color:${lt};border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
footer{text-align:center;color:#6A6478;font-size:13px}
